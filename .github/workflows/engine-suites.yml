name: Engine suites
# Gable's own test suites inside the embedded engines (TASK-100.10,
# js-engine-spec section 11 condition 2; the spec lives in the agnijs
# repository). The engine itself is a git dependency of native/engine-harness,
# pinned by revision in its Cargo.lock; engine CI (test262, GC stress, Miri,
# sanitizers) runs in the agnijs repository. Every in-scope test file is
# bundled and run in a fresh engine by native/engine-harness; the list of
# known failures is native/engine-harness/js/suites-expected.json.
on:
  push:
    branches: [main]
    paths: ["native/**", "packages/**", "vitest.config.ts", "package-lock.json", ".github/workflows/engine-suites.yml"]
  pull_request:
    paths: ["native/**", "packages/**", "vitest.config.ts", "package-lock.json", ".github/workflows/engine-suites.yml"]
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine-harness
      - name: Build the harness
        run: cargo build --release --locked
        working-directory: native/engine-harness
      - name: Harness tests (event loop, host, benchmark protocol)
        run: cargo test --release --locked
        working-directory: native/engine-harness
      - name: In-scope suites under Node (checks the vitest shim)
        run: node native/engine-harness/js/run-suites.mjs --engine node
      - name: In-scope suites under the AgniJS engine (gates the default engine)
        run: node native/engine-harness/js/run-suites.mjs --engine agnijs --json engine-suites-agnijs.json
      - name: In-scope suites under the interim engine (QuickJS-NG, selectable for one release)
        run: node native/engine-harness/js/run-suites.mjs --engine quickjs --json engine-suites-quickjs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-suites-${{ matrix.os }}
          path: engine-suites-*.json

  bench:
    # Reported, never gated (spec section 11, condition 3): numbers for the
    # switch-over report's performance section, uploaded as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/engine-harness
      - run: cargo build --release --locked
        working-directory: native/engine-harness
      - run: node native/engine-harness/js/run-bench.mjs --out engine-bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: engine-bench
          path: engine-bench.json
