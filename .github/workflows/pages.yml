name: Deploy site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run api:strict -w site
      - run: npm test -w site
      - run: npm run check -w site
      - run: npm run build -w site
        env:
          SITE_BASE: /gable/
      # Single-page site: serve the app for any path so a deep link or refresh never 404s.
      - run: cp site/dist/index.html site/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
