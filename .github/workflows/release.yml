name: Release
# Publishes the lockstep @gable/* packages, create-gable and gable-ui to npm with Changesets.
# On every push to main: if changesets are pending, this opens (or updates) a "Version packages" pull request;
# when that pull request is merged, the packages whose version is not on npm yet are published.
# Needs the NPM_TOKEN repository secret: an npm automation token (or granular token) with publish rights on the @gable scope.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
