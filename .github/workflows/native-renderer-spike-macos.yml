# PROTOTYPE (TASK-99.22). Manual only: never runs on push or pull_request.
name: native-renderer-spike-macos
on:
  workflow_dispatch:
jobs:
  spike:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/prototype/renderer-spike
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Machine and GPU info
        run: |
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType || true
      - name: Build spike (release)
        run: cargo build --release -p gable-renderer-spike
      - name: Headless checks that need no GPU (picking table, path seam)
        run: |
          mkdir -p out
          ./target/release/gable-renderer-spike hit | tee out/hit-table.md
          ./target/release/gable-renderer-spike paths out
      - name: Metal compositor render (may fail if the runner VM exposes no Metal device)
        continue-on-error: true
        env:
          WGPU_BACKEND: metal
        run: |
          ./target/release/gable-renderer-spike render out/scene-metal.png 1 | tee out/metal.txt
          ./target/release/gable-renderer-spike bench 100 | tee -a out/metal.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-macos-outputs
          path: native/prototype/renderer-spike/out
