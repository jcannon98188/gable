[workspace]
resolver = "2"
members = [
    "crates/gable-engine-api",
    "crates/gable-engine-quickjs",
    "crates/gable-js-parser",
    "crates/gable-js-compiler",
    "crates/gable-js-vm",
    "crates/gable-js-regex",
    "crates/gable-js-intl",
    "crates/gable-js-debugger",
    "crates/gable-js-cdp",
    "crates/gable-js-test262",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/jcannon98188/gable"

[workspace.dependencies]
gable-engine-api = { path = "crates/gable-engine-api" }
gable-engine-quickjs = { path = "crates/gable-engine-quickjs" }
gable-js-parser = { path = "crates/gable-js-parser" }
gable-js-compiler = { path = "crates/gable-js-compiler" }
gable-js-vm = { path = "crates/gable-js-vm" }
gable-js-regex = { path = "crates/gable-js-regex" }
gable-js-intl = { path = "crates/gable-js-intl" }
gable-js-debugger = { path = "crates/gable-js-debugger" }
gable-js-cdp = { path = "crates/gable-js-cdp" }
rquickjs = { version = "0.14", features = ["loader", "array-buffer", "classes", "properties"] }
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
anyhow = "1"
unicode-id-start = "1"

[profile.release]
debug = 1
