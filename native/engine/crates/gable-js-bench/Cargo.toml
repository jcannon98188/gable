[package]
name = "gable-js-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Engine micro-benchmarks: the same JS workloads on every engine behind the engine interface"
publish = false

[dependencies]
gable-engine-api.workspace = true
gable-engine-quickjs.workspace = true
gable-js-vm.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true

# Process peak working set. Already in the lockfile (through clap), so the
# standalone build stays offline-lockable.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bin]]
name = "bench"
path = "src/main.rs"
