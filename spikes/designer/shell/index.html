<!doctype html>
<meta charset="utf-8" />
<title>Gable designer (spike)</title>
<style>
  body { margin: 0; font: 13px system-ui; display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  iframe { width: 100%; height: 100%; border: 0; }
  aside { padding: 8px; overflow: auto; border-left: 1px solid #ccc; }
  pre { background: #f4f4f4; padding: 6px; white-space: pre-wrap; }
  #tree div { cursor: default; }
  #tree div:hover { background: #fde; }
</style>
<main><iframe id="preview"></iframe></main>
<aside>
  <label><input type="checkbox" id="pick" checked /> pick mode</label>
  <h4>Picked</h4><div id="picked">click an element in the preview</div>
  <h4>Component tree</h4><div id="tree"></div>
</aside>
<script type="module" src="shell.js"></script>
